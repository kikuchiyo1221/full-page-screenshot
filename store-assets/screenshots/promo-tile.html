<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:440px; height:280px; overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background:linear-gradient(135deg,#1e3a8a 0%, #2563eb 55%, #38bdf8 100%);
    color:#fff; display:flex; align-items:center; gap:22px; padding:0 30px;
  }
  .art { flex:0 0 118px; height:196px; border-radius:9px; background:#fff; overflow:hidden;
         box-shadow:0 14px 30px rgba(2,6,23,.4); }
  .hero { height:30px; background:linear-gradient(90deg,#1e293b,#475569); }
  .row { display:flex; gap:5px; padding:6px 7px; }
  .cd { flex:1; height:26px; border-radius:4px; background:#dbeafe; }
  .ln { height:5px; border-radius:3px; background:#e2e8f0; margin:5px 7px; }
  .ln.s { width:52%; }
  h1 { font-size:31px; font-weight:800; line-height:1.24; letter-spacing:-0.01em; }
  p { margin-top:11px; font-size:14px; font-weight:600; color:#dbeafe; line-height:1.5; }
  .tags { margin-top:15px; display:flex; gap:7px; }
  .tag { font-size:11px; font-weight:700; background:rgba(255,255,255,.2); padding:4px 9px; border-radius:999px; }
</style></head>
<body>
  <div class="art">
    <div class="hero"></div>
    <div class="row"><div class="cd"></div><div class="cd"></div></div>
    <div class="ln"></div><div class="ln s"></div>
    <div class="row"><div class="cd"></div><div class="cd"></div></div>
    <div class="ln"></div><div class="ln s"></div><div class="ln"></div>
    <div class="row"><div class="cd"></div><div class="cd"></div></div>
    <div class="ln s"></div><div class="ln"></div>
  </div>
  <div>
    <h1>ページ全体を<br>1枚に。</h1>
    <p>撮って、注釈して、保存。<br>権限は最小限。</p>
    <div class="tags"><span class="tag">PNG</span><span class="tag">JPEG</span><span class="tag">PDF</span></div>
  </div>
</body></html>
