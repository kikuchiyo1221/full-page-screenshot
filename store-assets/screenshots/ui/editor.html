<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../../editor/editor.css">
<style>
  .canvas-container { background:#fff; }
  .shot { width:100%; height:100%; display:block; }
</style></head>
<body>
  <div class="editor-container">
    <header class="editor-toolbar">
      <div class="toolbar-left">
        <div class="tool-group">
          <button class="tool-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg><span>矢印</span></button>
          <button class="tool-btn active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg><span>四角形</span></button>
          <button class="tool-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg><span>円</span></button>
          <button class="tool-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg><span>テキスト</span></button>
          <button class="tool-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path></svg><span>マーカー</span></button>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-group">
          <div class="color-picker-wrapper"><div class="color-preview" style="background:#ff0000"></div></div>
          <input type="range" min="1" max="20" value="4" class="stroke-slider">
          <span class="stroke-value">4px</span>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-group">
          <button class="tool-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg></button>
          <button class="tool-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg></button>
          <button class="tool-btn danger"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
        </div>
      </div>
      <div class="toolbar-right">
        <div class="format-select-wrapper"><select class="format-select"><option>PNG</option></select></div>
        <button class="action-btn secondary">コピー</button>
        <button class="action-btn primary">保存</button>
        <button class="action-btn text">キャンセル</button>
      </div>
    </header>
    <main class="editor-canvas-wrapper">
      <div class="canvas-container" id="canvas-container" style="width:640px;height:400px">
        <svg class="shot" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
          <rect width="640" height="400" fill="#ffffff"/>
          <rect width="640" height="58" fill="#1e293b"/>
          <rect x="20" y="20" width="150" height="18" rx="4" fill="#64748b"/>
          <rect x="20" y="86" width="288" height="128" rx="8" fill="#e2e8f0"/>
          <rect x="332" y="86" width="288" height="128" rx="8" fill="#dbeafe"/>
          <rect x="20" y="238" width="600" height="11" rx="5" fill="#e2e8f0"/>
          <rect x="20" y="264" width="452" height="11" rx="5" fill="#e2e8f0"/>
          <rect x="20" y="290" width="530" height="11" rx="5" fill="#e2e8f0"/>
          <rect x="20" y="330" width="180" height="42" rx="8" fill="#e2e8f0"/>
          <!-- annotations drawn by the editor -->
          <rect x="326" y="80" width="300" height="140" fill="none" stroke="#ff0000" stroke-width="4" rx="2"/>
          <g stroke="#ff0000" stroke-width="4" fill="#ff0000" stroke-linecap="round">
            <line x1="120" y1="352" x2="300" y2="256"/>
            <polygon points="300,256 279,258 288,275"/>
          </g>
          <rect x="20" y="234" width="600" height="19" fill="#ffe600" opacity="0.4"/>
          <text x="120" y="378" font-family="sans-serif" font-size="22" fill="#ff0000">ここが重要</text>
        </svg>
      </div>
    </main>
  </div>
</body></html>
